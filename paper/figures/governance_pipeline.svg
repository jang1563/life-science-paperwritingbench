<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Life-Science PaperWritingBench governance pipeline</title>
  <desc id="desc">A governance-first benchmark pipeline from source papers through qualification, evidence freezing, release controls, model generation, scoring, and readiness gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Helvetica, Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Helvetica, Arial, sans-serif; fill: #0f172a; letter-spacing: 0.3px; }
      .box-title { font: 700 16px Helvetica, Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 13px Helvetica, Arial, sans-serif; fill: #334155; }
      .chip { font: 700 12px Helvetica, Arial, sans-serif; fill: #334155; }
      .note-title { font: 700 15px Helvetica, Arial, sans-serif; fill: #7c2d12; }
      .note-text { font: 400 13px Helvetica, Arial, sans-serif; fill: #7c2d12; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .box { stroke: #cbd5e1; stroke-width: 1.4; rx: 14; ry: 14; }
      .header { stroke-width: 0; rx: 12; ry: 12; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="64" y="56" class="title">Life-Science PaperWritingBench: Governance-First Evaluation Pipeline</text>
  <text x="64" y="84" class="subtitle">Biomedical section-writing tasks are released only after qualification, evidence freezing, split safety, and contamination controls.</text>

  <rect x="58" y="115" width="204" height="34" class="header" fill="#dbeafe"/>
  <text x="160" y="137" text-anchor="middle" class="section">1. QUALIFY</text>

  <rect x="298" y="115" width="204" height="34" class="header" fill="#dcfce7"/>
  <text x="400" y="137" text-anchor="middle" class="section">2. FREEZE</text>

  <rect x="538" y="115" width="204" height="34" class="header" fill="#fef3c7"/>
  <text x="640" y="137" text-anchor="middle" class="section">3. RELEASE</text>

  <rect x="778" y="115" width="204" height="34" class="header" fill="#ede9fe"/>
  <text x="880" y="137" text-anchor="middle" class="section">4. EVALUATE</text>

  <rect x="1018" y="115" width="204" height="34" class="header" fill="#fee2e2"/>
  <text x="1120" y="137" text-anchor="middle" class="section">5. GATE</text>

  <rect x="58" y="178" width="204" height="78" class="box" fill="#eff6ff"/>
  <text x="160" y="207" text-anchor="middle" class="box-title">Source Papers</text>
  <text x="160" y="231" text-anchor="middle" class="box-text">published biomedical studies</text>

  <line x1="160" y1="256" x2="160" y2="296" class="line"/>

  <rect x="58" y="296" width="204" height="112" class="box" fill="#eff6ff"/>
  <text x="160" y="325" text-anchor="middle" class="box-title">Paper Qualification</text>
  <text x="160" y="350" text-anchor="middle" class="box-text">scientific quality</text>
  <text x="160" y="370" text-anchor="middle" class="box-text">packaging safety</text>
  <text x="160" y="390" text-anchor="middle" class="box-text">integrity status</text>

  <line x1="262" y1="352" x2="298" y2="352" class="line"/>

  <rect x="298" y="178" width="204" height="78" class="box" fill="#f0fdf4"/>
  <text x="400" y="207" text-anchor="middle" class="box-title">Evidence Units</text>
  <text x="400" y="231" text-anchor="middle" class="box-text">local support and provenance</text>

  <line x1="400" y1="256" x2="400" y2="296" class="line"/>

  <rect x="298" y="296" width="204" height="112" class="box" fill="#f0fdf4"/>
  <text x="400" y="325" text-anchor="middle" class="box-title">TruthManifest Freeze</text>
  <text x="400" y="350" text-anchor="middle" class="box-text">assertions</text>
  <text x="400" y="370" text-anchor="middle" class="box-text">evidence items</text>
  <text x="400" y="390" text-anchor="middle" class="box-text">provenance records</text>

  <line x1="502" y1="352" x2="538" y2="352" class="line"/>

  <rect x="538" y="178" width="204" height="78" class="box" fill="#fffbeb"/>
  <text x="640" y="207" text-anchor="middle" class="box-title">Benchmark Units</text>
  <text x="640" y="231" text-anchor="middle" class="box-text">unit-level release contracts</text>

  <line x1="640" y1="256" x2="640" y2="292" class="line"/>

  <rect x="538" y="292" width="204" height="86" class="box" fill="#fffbeb"/>
  <text x="640" y="321" text-anchor="middle" class="box-title">Release Tiers</text>
  <rect x="559" y="342" width="70" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="594" y="358" text-anchor="middle" class="chip">public</text>
  <rect x="635" y="342" width="70" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="670" y="358" text-anchor="middle" class="chip">shadow</text>
  <rect x="597" y="372" width="86" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="640" y="388" text-anchor="middle" class="chip">stress</text>

  <line x1="640" y1="378" x2="640" y2="434" class="line"/>

  <rect x="538" y="434" width="204" height="88" class="box" fill="#fffbeb"/>
  <text x="640" y="463" text-anchor="middle" class="box-title">Split Safety</text>
  <text x="640" y="488" text-anchor="middle" class="box-text">public/private holdout</text>
  <text x="640" y="508" text-anchor="middle" class="box-text">canary policy</text>

  <line x1="742" y1="478" x2="778" y2="478" class="line"/>

  <rect x="778" y="178" width="204" height="78" class="box" fill="#f5f3ff"/>
  <text x="880" y="207" text-anchor="middle" class="box-title">TaskBundles</text>
  <text x="880" y="231" text-anchor="middle" class="box-text">methods, results, abstract</text>

  <line x1="880" y1="256" x2="880" y2="296" class="line"/>

  <rect x="778" y="296" width="204" height="112" class="box" fill="#f5f3ff"/>
  <text x="880" y="325" text-anchor="middle" class="box-title">Model Generation</text>
  <text x="880" y="350" text-anchor="middle" class="box-text">single pass</text>
  <text x="880" y="370" text-anchor="middle" class="box-text">writer -&gt; critic -&gt; reviser</text>
  <text x="880" y="390" text-anchor="middle" class="box-text">conservative selector</text>

  <line x1="880" y1="408" x2="880" y2="448" class="line"/>

  <rect x="778" y="448" width="204" height="88" class="box" fill="#f5f3ff"/>
  <text x="880" y="477" text-anchor="middle" class="box-title">Scoring And Judge</text>
  <text x="880" y="502" text-anchor="middle" class="box-text">deterministic scoring v2</text>
  <text x="880" y="522" text-anchor="middle" class="box-text">rubric judge v3</text>

  <line x1="982" y1="492" x2="1018" y2="492" class="line"/>

  <rect x="1018" y="178" width="204" height="78" class="box" fill="#fef2f2"/>
  <text x="1120" y="207" text-anchor="middle" class="box-title">Matrix Summaries</text>
  <text x="1120" y="231" text-anchor="middle" class="box-text">hosted-frontier cells</text>

  <line x1="1120" y1="256" x2="1120" y2="296" class="line"/>

  <rect x="1018" y="296" width="204" height="86" class="box" fill="#fef2f2"/>
  <text x="1120" y="325" text-anchor="middle" class="box-title">Canary Probes</text>
  <text x="1120" y="350" text-anchor="middle" class="box-text">redacted contamination checks</text>

  <line x1="1120" y1="382" x2="1120" y2="428" class="line"/>

  <rect x="1018" y="428" width="204" height="108" class="box" fill="#fef2f2"/>
  <text x="1120" y="457" text-anchor="middle" class="box-title">Readiness Gates</text>
  <text x="1120" y="482" text-anchor="middle" class="box-text">human agreement</text>
  <text x="1120" y="502" text-anchor="middle" class="box-text">Gemini coverage</text>
  <text x="1120" y="522" text-anchor="middle" class="box-text">open-weight track</text>

  <line x1="1018" y1="217" x2="982" y2="217" class="soft-line"/>
  <line x1="1018" y1="339" x2="982" y2="492" class="soft-line"/>

  <rect x="64" y="600" width="540" height="92" rx="18" ry="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="92" y="631" class="box-title">Current preview can claim</text>
  <text x="92" y="656" class="box-text">governance stack, three writing families, deterministic v2, judge v3, partial matrix, redacted canaries</text>
  <text x="92" y="676" class="box-text">and a structurally ready 60-bundle human-validation batch</text>

  <rect x="676" y="600" width="540" height="92" rx="18" ry="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="704" y="631" class="note-title">Current preview must not claim</text>
  <text x="704" y="656" class="note-text">human-validated benchmark status, final leaderboard readiness, Gemini-complete coverage,</text>
  <text x="704" y="676" class="note-text">registry-complete contamination clearance, or hosted/open-weight equivalence</text>
</svg>
