[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "life-science-paperwritingbench"
version = "0.1.0"
description = "Qualification scaffolding for a life-science source-paper benchmark."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "OpenAI Codex"}
]
keywords = ["benchmark", "biomedical", "life-science", "paperwritingbench", "research-quality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.scripts]
lspwb = "life_science_paperwritingbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
